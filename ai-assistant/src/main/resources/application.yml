server:
  port: 8080

spring:
  application:
    name: ai-assistant

# AI Configuration
ai:
  # Dify Configuration
  dify:
    enabled: true
    base-url: http://localhost
    api-key: ${DIFY_API_KEY:your-dify-api-key}
    timeout:
      connect: 30
      read: 60
      write: 60

  # OpenAI Configuration
  openai:
    enabled: true
    api-key: ${OPENAI_API_KEY:your-openai-api-key}
    model: gpt-4
    temperature: 0.7
    max-tokens: 2000
    base-url: https://api.openai.com/v1

  # LangGraph Service (Python)
  langgraph:
    enabled: false
    base-url: http://localhost:5000

# Logging
logging:
  level:
    root: INFO
    com.example.ai: DEBUG
    dev.langchain4j: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
